<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Pace Notes Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Palete de caderno de notas de rali, à noite: fundo carvão, âmbar de lanterna, escala de severidade do vermelho ao verde. */
  :root {
    --bg: #0e1113; --panel: #161b1e; --line: #2a3338; --fg: #e9eeeb; --muted: #8e9c97;
    --accent: #ffb21e; --accent-ink: #1a1300; --left: #52c7ff; --right: #ff8a5c;
    --map: #0b0e10; --road: #e9eeeb; --past: #3a454a;
    --s1: #ff4d4d; --s2: #ff8a3d; --s3: #ffc233; --s4: #b8d94a; --s5: #5fd38a;
    --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --ui: "Inter", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  html, body { background: var(--bg); }
  body { color: var(--fg); font: 15px/1.45 var(--ui); padding-block: 14px 40px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font: 700 30px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
  .stats { font: 400 12px/1.4 var(--mono); color: var(--muted); margin: 6px 0 0; overflow-wrap: anywhere; }
  .stage { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--map); }
  canvas { display: block; width: 100%; height: clamp(320px, 56vh, 560px); }
  .hud { position: absolute; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
         padding: 12px 14px; background: linear-gradient(var(--map) 55%, transparent); pointer-events: none; }
  #callout { font: 700 clamp(30px, 8vw, 46px)/1 var(--display); text-transform: uppercase; letter-spacing: .02em; min-width: 0; text-wrap: balance; }
  #callout.flash { animation: flash .7s ease-out; }
  @keyframes flash { from { color: var(--accent); } to { color: var(--fg); } }
  .side { text-align: right; flex: none; }
  #dist { font: 700 clamp(30px, 8vw, 46px)/1 var(--display); color: var(--accent); }
  .speed { font: 500 12px var(--mono); color: var(--muted); }
  .speed b { font-size: 20px; color: var(--fg); font-weight: 700; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .modes { display: flex; gap: 6px; }
  button { font: 600 14px var(--ui); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-width: 118px; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .bar .grow { flex: 1; min-width: 160px; }
  .mono { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 13px; }
  .row output { font: 500 13px var(--mono); color: var(--accent); }
  .row input { grid-column: 1 / -1; }
  details > summary { cursor: pointer; font: 600 13px var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  details[open] > summary { margin-bottom: 12px; }
  .inner { display: flex; flex-direction: column; gap: 12px; }
  select { font: 400 13px var(--ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; max-width: 100%; }
  label.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  #log { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; font: 400 13px/1.5 var(--mono); }
  #log li { display: flex; gap: 12px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  #log .km { color: var(--muted); flex: none; }
  #log li.skipped { color: var(--muted); text-decoration: line-through; }
  .note { color: var(--muted); font-size: 12px; margin: 0; }
  #gpsMsg { font: 400 13px var(--mono); color: var(--muted); margin: 0; overflow-wrap: anywhere; }
  .file { font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #callout.flash { animation: none; } }
</style>
<div class="wrap">
  <header>
    <h1>Pace Notes Lab</h1>
    <p class="stats" id="stats"></p>
  </header>

  <div class="stage">
    <canvas id="map" aria-label="Mapa do percurso visto de cima, com a frente do carro para cima"></canvas>
    <div class="hud">
      <div id="callout">—</div>
      <div class="side"><div id="dist"></div><div class="speed"><b id="kmh">0</b> km/h</div></div>
    </div>
  </div>

  <section class="panel" aria-label="Controlos">
    <div class="modes">
      <button id="modeSim" aria-pressed="true">Simulação</button>
      <button id="modeGps" aria-pressed="false">GPS real</button>
    </div>
    <div id="simControls" class="inner">
      <div class="bar">
        <button id="play" class="primary">Iniciar</button>
        <span class="mono" id="kmLabel"></span>
      </div>
      <input type="range" id="seek" min="0" max="1000" step="10" value="0" aria-label="Posição no percurso">
      <div class="bar">
        <label class="check" for="pace">Andamento
          <select id="pace">
            <option value="calmo">Calmo</option>
            <option value="normal">Normal</option>
            <option value="rapido">Rápido</option>
            <option value="constante">Velocidade constante</option>
          </select>
        </label>
        <div class="grow"><input type="range" id="speedRange" min="30" max="130" step="5" aria-label="Velocidade máxima simulada"><span class="mono" id="speedLabel"></span></div>
      </div>
      <p class="note" id="simInfo"></p>
    </div>
    <div id="gpsBox" class="inner" hidden>
      <p id="gpsMsg"></p>
      <p class="note">No modo GPS a posição vem do telemóvel e a voz acompanha-te ao longo da rota carregada. Mantém o ecrã ligado e o Safari à frente. A localização fica só neste telemóvel.</p>
      <p class="mono" id="recInfo"></p>
      <div class="bar">
        <button id="recSave">Descarregar gravação</button>
        <button id="recClear">Apagar gravação</button>
      </div>
    </div>
    <div id="mainTuning" class="inner"></div>
    <label class="check"><input type="checkbox" id="voiceOn" checked> Voz ligada</label>
  </section>

  <details class="panel">
    <summary>Afinação</summary>
    <div class="inner">
      <div id="tuning" class="inner"></div>
      <div class="bar"><button id="reset">Repor valores</button></div>
    </div>
  </details>

  <details class="panel">
    <summary>Voz e percurso</summary>
    <div class="inner">
      <div class="bar"><select id="voice" aria-label="Voz"></select><button id="testVoice">Testar voz</button></div>
      <label class="file">Carregar outro percurso (GPX): <input type="file" id="gpx" accept=".gpx,application/gpx+xml,.xml"></label>
    </div>
  </details>

  <details class="panel" open>
    <summary>Chamadas feitas</summary>
    <div class="inner">
      <ul id="log"></ul>
      <div class="bar"><button id="clearLog">Limpar</button></div>
    </div>
  </details>
</div>

<script>
// Motor de pace notes (porta do pacote Swift PaceNotesCore).
const PaceEngine = (() => {
  const MPD = 111194.9; // metros por grau de latitude

  function parseGPX(text) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    return [...doc.querySelectorAll('trkpt, rtept')].map(e => [+e.getAttribute('lat'), +e.getAttribute('lon')]);
  }

  // Reamostra o percurso a intervalos fixos, em metros locais (x = leste, y = norte).
  function buildTrack(raw, step = 5) {
    const lat0 = raw[0][0], lon0 = raw[0][1];
    const cosLat = Math.cos(lat0 * Math.PI / 180);
    const pts = [], cum = [];
    for (const [la, lo] of raw) {

        const d = Math.hypot(p.x - l.x, p.y - l.y);
        if (d < 0.5) continue;

    const total = cum[cum.length - 1];

      let kk = 0;

      v[i] = Math.max(3, Math.min(o.vmax, kk > 1e-6 ? Math.sqrt(o.latAcc / kk) : o.vmax));
    }
    for (let i = n - 2; i >= 0; i--) v[i] = Math.min(v[i], Math.sqrt(v[i + 1] ** 2 + 2 * o.decel * step));
    v[0] = Math.min(v[0], 8);
    for (let i = 1; i < n; i++) v[i] = Math.min(v[i], Math.sqrt(v[i - 1] ** 2 + 2 * o.accel * step));
    const T = new Float64Array(n);
    for (let i = 1; i < n; i++) T[i] = T[i - 1] + (2 * step) / (v[i - 1] + v[i]);
    return { v, T };
  }

  function detect(tr, cfg) {
    const k = cfg.window || 3, step = tr.step, n = tr.xy.length;
    if (n < 2 * k + 4) return [];
    const { h, kap } = curvature(tr, k);

    const thr = 1 / cfg.maxRadius;
    const runs = [];
    for (let i = 0; i < n;) {
      if (Math.abs(kap[i]) > thr) {
        const pos = kap[i] > 0;
        let j = i;
        while (j + 1 < n && Math.abs(kap[j + 1]) > thr && (kap[j + 1] > 0) === pos) j++;
        runs.push({ s: i, e: j, pos });
        i = j + 1;
      } else i++;
    }
    const merged = [];
    for (const r of runs) {
      const last = merged[merged.length - 1];
      if (last && last.pos === r.pos && r.s - last.e <= cfg.mergeGap) last.e = r.e;
      else merged.push({ ...r });
    }
    const median = a => [...a].sort((x, y) => x - y)[a.length >> 1];
    const corners = [];
    for (const r of merged) {
      const a = Math.max(0, r.s - k), b = Math.min(n - 2, r.e + k);
      if (b <= a) continue;
      let total = 0;
      for (let j = a; j < b; j++) total += wrap(h[j + 1] - h[j]);
      const angle = Math.abs(total) * 180 / Math.PI;
      if (angle < cfg.minAngle) continue;
      const radii = [];
      for (let j = r.s; j <= r.e; j++) radii.push(1 / Math.max(Math.abs(kap[j]), 1e-6));
      const minR = Math.min(...radii);
      const sev = severity(minR);
      if (sev === 6 && angle < 45) continue;
      let s0 = r.s + k, e0 = r.e - k;
      if (e0 <= s0) { s0 = (r.s + r.e) >> 1; e0 = s0; }
      let trend = 'none';
      if (radii.length >= 8) {
        const half = radii.length >> 1;
        const f = median(radii.slice(0, half)), l = median(radii.slice(half));
        if (l < f * 0.75) trend = 'tightens'; else if (l > f * 1.33) trend = 'opens';
      }
      corners.push({ start: s0 * step, end: e0 * step, dir: r.pos ? 'R' : 'L', angle, minR, sev,
                     hairpin: minR < 22 && angle >= 110, trend });
    }
    return corners;
  }

  // Agrupa curvas muito próximas numa só chamada ("esquerda 3 para direita 4").
  function buildNotes(corners, opt) {
    const list = corners.filter(c => c.sev <= opt.maxSev);
    const notes = [];
    let cur = [];
    const push = () => { if (cur.length) notes.push({ corners: cur, start: cur[0].start, end: cur[cur.length - 1].end }); };
    for (const c of list) {
      const last = cur[cur.length - 1];
      if (last && c.start - last.end <= opt.linkGap && cur.length < opt.maxChain) cur.push(c);
      else { push(); cur = [c]; }
    }
    push();
    return notes;
  }

  function describe(c) {
    const side = c.dir === 'L' ? 'esquerda' : 'direita';
    const parts = [];
    if (c.hairpin) parts.push('gancho à ' + side);
    else {
      parts.push(side + ' ' + c.sev);
      if (c.end - c.start >= 70) parts.push('longa');
    }
    if (c.trend === 'tightens') parts.push('aperta');
    if (c.trend === 'opens') parts.push('abre');
    return parts.join(', ');
  }

  function noteText(note) {
    const s = note.corners.map(describe).join(' para ');
    return s[0].toUpperCase() + s.slice(1);
  }

  function spokenDistance(m) {
    const v = m < 100 ? Math.max(10, Math.round(m / 10) * 10) : Math.round(m / 50) * 50;
    return v + ' metros';
  }

  const call = (note, dist) => noteText(note) + ', ' + spokenDistance(dist);

  return { MPD, parseGPX, buildTrack, curvature, speedProfile, detect, buildNotes, describe, noteText, spokenDistance, call, severity };
})();

  let raw = ROUTE, routeName = ROUTE_NAME;

  function buildTuning() {

      show();

  function init() {
    buildTuning();
    const speedText = () => { $('speedLabel').textContent = (PACES[cfg.pace] ? 'máx. ' : '') + cfg.kmh + ' km/h'; };
    $('speedRange').value = cfg.kmh;
    $('pace').value = cfg.pace;
    speedText();
    $('speedRange').addEventListener('input', e => { cfg.kmh = +e.target.value; speedText(); save(); rebuildProfile(); });
    $('pace').addEventListener('change', e => { cfg.pace = e.target.value; speedText(); save(); rebuildProfile(); });
    $('play').addEventListener('click', () => {
      if (!playing && s >= track.length) seekTo(0);
      if (!playing && 'speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance(''));
      setPlaying(!playing);
    });
    $('seek').addEventListener('input', e => seekTo(+e.target.value));
    $('voiceOn').addEventListener('change', e => { voiceOn = e.target.checked; if (!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel(); });
    $('modeSim').addEventListener('click', () => setMode('sim'));
    $('modeGps').addEventListener('click', () => setMode('gps'));
    $('reset').addEventListener('click', () => {
      Object.assign(cfg, DEFAULTS); save();
      for (const sp of SPECS) { $('t-' + sp.k).value = cfg[sp.k]; $('t-' + sp.k).dispatchEvent(new Event('input')); }
      $('speedRange').value = cfg.kmh; $('pace').value = cfg.pace; speedText(); rebuildProfile();
    });
    $('testVoice').addEventListener('click', () => speak('Esquerda 3, aperta, 100 metros'));
    $('gpx').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      const pts = E.parseGPX(await f.text());
      if (pts.length < 10) { $('stats').textContent = 'Este ficheiro não tem um percurso válido.'; return; }
      setPlaying(false); setRoute(pts, f.name.replace(/\.gpx$/i, ''));
    });
    $('clearLog').addEventListener('click', () => $('log').replaceChildren());
    $('recSave').addEventListener('click', recDownload);
    $('recClear').addEventListener('click', () => {
      if ($('recClear').dataset.confirm !== '1') {
        $('recClear').dataset.confirm = '1'; $('recClear').textContent = 'Confirmar apagar';
        setTimeout(() => { $('recClear').dataset.confirm = ''; $('recClear').textContent = 'Apagar gravação'; }, 4000);
        return;
      }
      rec = null; try { localStorage.removeItem('pn-rec'); } catch (e) {}
      $('recClear').dataset.confirm = ''; $('recClear').textContent = 'Apagar gravação';
      recShow();
    });
    recShow();
    if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.addEventListener('voiceschanged', loadVoices); }
    else { $('voiceOn').disabled = true; $('voice').disabled = true; $('testVoice').disabled = true; }
    setRoute(raw, routeName);
    setPlaying(false);
    requestAnimationFrame(tick);
  }
  init();
})();

</script>
</body></html>
